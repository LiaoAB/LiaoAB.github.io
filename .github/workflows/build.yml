name: Validate and build sites

on:
  push: {}
  pull_request: {}

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site sources
        run: npm run check:site

      - name: Build deployment bundle
        run: npm run build

      - name: Verify 2027NZ deployment output
        run: npm run check:nz2027 -- --dist
