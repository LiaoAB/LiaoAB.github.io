<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="eb-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#100b20"/>
    </linearGradient>
    <radialGradient id="eb-glow" cx="0.72" cy="0.45" r="0.55">
      <stop stop-color="#a78bfa" stop-opacity=".38"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eb-face" x1="440" y1="180" x2="680" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="eb-bubble" x1="120" y1="170" x2="120" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="eb-chip-1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f472b6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="eb-chip-2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a78bfa" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="eb-chip-3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="eb-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity=".07"/>
    </pattern>
    <filter id="eb-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#eb-bg)"/>
  <rect width="800" height="600" fill="url(#eb-dots)"/>
  <circle cx="580" cy="290" r="280" fill="url(#eb-glow)"/>

  <!-- orbit -->
  <circle cx="570" cy="292" r="158" stroke="#a78bfa" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 11"/>
  <circle cx="570" cy="292" r="196" stroke="#22d3ee" stroke-opacity=".12" stroke-width="1.5"/>

  <!-- glowing face -->
  <circle cx="570" cy="292" r="118" fill="#080b14" stroke="url(#eb-face)" stroke-width="2.5"/>
  <circle cx="570" cy="292" r="118" fill="url(#eb-face)" opacity=".05"/>
  <circle cx="532" cy="266" r="12" fill="#e9edf7"/>
  <circle cx="608" cy="266" r="12" fill="#e9edf7"/>
  <path d="M516 318c18 34 90 34 108 0" stroke="url(#eb-face)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="500" cy="306" r="15" fill="#f472b6" opacity=".18"/>
  <circle cx="640" cy="306" r="15" fill="#f472b6" opacity=".18"/>
  <circle cx="663" cy="208" r="5" fill="#22d3ee" opacity=".9"/>
  <circle cx="472" cy="370" r="4" fill="#f472b6" opacity=".8"/>

  <!-- chat bubble -->
  <g>
    <path d="M120 162h302a30 30 0 0 1 30 30v148a30 30 0 0 1-30 30H244l-45 50v-50h-79a30 30 0 0 1-30-30V192a30 30 0 0 1 30-30Z" fill="url(#eb-bubble)" stroke="#22d3ee" stroke-opacity=".38" stroke-width="1.6"/>
    <rect x="152" y="206" width="218" height="12" rx="6" fill="#22d3ee" opacity=".55"/>
    <rect x="152" y="240" width="166" height="12" rx="6" fill="#e9edf7" opacity=".24"/>
    <rect x="152" y="274" width="198" height="12" rx="6" fill="#e9edf7" opacity=".14"/>
    <rect x="152" y="308" width="120" height="12" rx="6" fill="#a78bfa" opacity=".35"/>
  </g>

  <!-- emoji suggestion chips -->
  <g>
    <rect x="132" y="414" width="66" height="66" rx="18" fill="url(#eb-chip-1)" stroke="#f472b6" stroke-opacity=".35"/>
    <path d="M165 462c-12-9-19-15-19-23a9 9 0 0 1 19-3 9 9 0 0 1 19 3c0 8-7 14-19 23Z" fill="#f472b6"/>

    <rect x="216" y="414" width="66" height="66" rx="18" fill="url(#eb-chip-2)" stroke="#a78bfa" stroke-opacity=".35"/>
    <path d="m249 428 6.5 14 15 2-11 10 3 15-13.5-7.5-13.5 7.5 3-15-11-10 15-2Z" fill="#a78bfa"/>

    <rect x="300" y="414" width="66" height="66" rx="18" fill="url(#eb-chip-3)" stroke="#22d3ee" stroke-opacity=".35"/>
    <path d="M340 427 324 452h13l-5 20 18-26h-13l3-19Z" fill="#22d3ee"/>
  </g>

  <!-- sparkles -->
  <path d="M692 132c2 10 6 14 16 16-10 2-14 6-16 16-2-10-6-14-16-16 10-2 14-6 16-16Z" fill="#22d3ee" opacity=".75"/>
  <path d="M112 88c1.5 7 4.5 10 11.5 11.5-7 1.5-10 4.5-11.5 11.5-1.5-7-4.5-10-11.5-11.5 7-1.5 10-4.5 11.5-11.5Z" fill="#f472b6" opacity=".6"/>
  <circle cx="700" cy="470" r="3" fill="#22d3ee" opacity=".7"/>
  <circle cx="92" cy="508" r="2.5" fill="#a78bfa" opacity=".7"/>
</svg>
