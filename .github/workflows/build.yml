name: Validate and build sites

on:
  push: {}
  pull_request: {}

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check NZ17 HTML and inline JavaScript
        run: npm run check:nz17

      - name: Build production bundle
        run: npm run build:portfolio

      - name: Build NZ17 deployment bundle
        run: npm run build

      - name: Verify NZ17 deployment output
        run: npm run check:nz17 -- --dist
