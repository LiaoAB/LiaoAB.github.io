<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sh-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080d12"/>
      <stop offset="1" stop-color="#0b1410"/>
    </linearGradient>
    <radialGradient id="sh-glow" cx="0.55" cy="0.5" r="0.55">
      <stop stop-color="#a3e635" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="sh-scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sh-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a3e635"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="sh-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity=".06"/>
    </pattern>
    <filter id="sh-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <g id="sh-sheep">
      <circle cx="-20" cy="-6" r="15" fill="#e9edf7" opacity=".92"/>
      <circle cx="0" cy="-15" r="17" fill="#f8fafc" opacity=".96"/>
      <circle cx="20" cy="-5" r="15" fill="#e9edf7" opacity=".92"/>
      <circle cx="0" cy="4" r="16" fill="#dbe4f2" opacity=".9"/>
      <circle cx="24" cy="8" r="10" fill="#1b2438"/>
      <circle cx="27" cy="5" r="2" fill="#a3e635"/>
      <path d="M-10 16v8M10 16v8" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sh-bg)"/>
  <rect width="800" height="600" fill="url(#sh-dots)"/>
  <circle cx="440" cy="300" r="290" fill="url(#sh-glow)"/>
  <ellipse cx="520" cy="470" rx="170" ry="40" fill="#a3e635" opacity=".12" filter="url(#sh-blur)"/>

  <!-- puzzle board -->
  <g>
    <rect x="196" y="96" width="424" height="424" rx="26" fill="#0b1018" stroke="#ffffff" stroke-opacity=".09"/>

    <!-- tiles -->
    <g>
      <rect x="204" y="104" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="312" y="104" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="420" y="104" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="528" y="104" width="84" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>

      <rect x="204" y="212" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="312" y="212" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="420" y="212" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="528" y="212" width="84" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>

      <rect x="204" y="320" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="312" y="320" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="420" y="320" width="100" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="528" y="320" width="84" height="100" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>

      <rect x="204" y="428" width="100" height="84" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="312" y="428" width="100" height="84" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="420" y="428" width="100" height="84" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
      <rect x="528" y="428" width="84" height="84" rx="18" fill="url(#sh-tile)" stroke="#ffffff" stroke-opacity=".06"/>
    </g>

    <!-- sheep -->
    <use href="#sh-sheep" x="254" y="154"/>
    <use href="#sh-sheep" x="470" y="154"/>
    <use href="#sh-sheep" x="362" y="262"/>
    <use href="#sh-sheep" x="254" y="370"/>
    <use href="#sh-sheep" x="578" y="370"/>
    <use href="#sh-sheep" x="470" y="478"/>

    <!-- target tile -->
    <rect x="312" y="320" width="100" height="100" rx="18" stroke="url(#sh-accent)" stroke-width="2" fill="#a3e635" fill-opacity=".05"/>
    <path d="M312 344v-24h24M388 296h24v24M336 420h-24v-24M412 420h-24v-24" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>

    <!-- scan line -->
    <rect x="204" y="366" width="408" height="2" fill="url(#sh-scan)" opacity=".7"/>
  </g>

  <!-- cursor -->
  <g transform="translate(466 356)">
    <path d="M0 0l30 11-12 4-5 13L0 0Z" fill="#f8fafc" stroke="#0b1018" stroke-width="2" stroke-linejoin="round"/>
    <path d="M17 17l10 15" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  </g>

  <path d="M160 190c2 9 5.5 12.5 14.5 14.5-9 2-12.5 5.5-14.5 14.5-2-9-5.5-12.5-14.5-14.5 9-2 12.5-5.5 14.5-14.5Z" fill="#a3e635" opacity=".7"/>
  <circle cx="690" cy="190" r="3" fill="#22d3ee" opacity=".8"/>
  <circle cx="122" cy="470" r="2.5" fill="#a3e635" opacity=".7"/>
</svg>
